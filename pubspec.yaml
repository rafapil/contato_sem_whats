name: zap_sem_contato
description: "Zap sem Contato - Crie links wa.me para WhatsApp sem adicionar contato"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  whatsapp_unilink: ^2.1.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^10.1.4
  excel: ^4.0.6
  path_provider: ^2.1.5
  flutter_slidable: ^3.1.2
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
